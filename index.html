<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StealthKeep</title>
<meta name="theme-color" content="#090D16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StealthKeep">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-48.png">

<style>
:root{--bg:#090D16;--card:#1E293B;--acc:#10B981;--cy:#06B6D4;--amb:#F59E0B;--vio:#8B5CF6;--t1:#F8FAFC;--t2:#94A3B8}
html,body{height:100%;background:var(--bg);color:var(--t2);font-family:Sarabun,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-top:env(safe-area-inset-top)}
.glass{background:rgba(30,41,59,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,.14);border-radius:16px}
.btn{background:var(--acc);color:#04120d;font-weight:700;border-radius:12px;padding:.55rem 1rem}
.btn2{border:1px solid rgba(148,163,184,.3);color:var(--t1);border-radius:12px;padding:.5rem .9rem}
input,select,textarea{background:#0F172A;border:1px solid rgba(148,163,184,.25);border-radius:12px;padding:.6rem .8rem;color:var(--t1);width:100%;outline:none}
input:focus,select:focus{border-color:var(--cy)}
.tag{font-size:.68rem;font-weight:700;padding:.1rem .45rem;border-radius:6px;border:1px solid}
.blur{filter:blur(7px);transition:filter .25s;cursor:pointer}
.scan{position:relative;overflow:hidden}.scan::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--cy);box-shadow:0 0 12px var(--cy);top:-4px;opacity:0}
.scan:hover::after,.scan:active::after{opacity:1;animation:sc 1.2s linear infinite}@keyframes sc{to{top:100%}}
.done{text-decoration:line-through;opacity:.5}
.nav a{flex:1;text-align:center;font-size:.7rem;padding:.5rem 0 calc(.5rem + env(safe-area-inset-bottom))}
.nav a.on{color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--cy)}.dot.f{background:var(--acc);border-color:var(--acc);box-shadow:0 0 10px var(--acc)}
.key{height:60px;border-radius:50%;font-size:1.5rem;color:var(--t1);background:rgba(30,41,59,.7);border:1px solid rgba(148,163,184,.15)}.key:active{background:var(--acc);color:#000}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ed{min-height:90px;background:#0F172A;border:1px solid rgba(148,163,184,.25);border-radius:12px;padding:.6rem;color:var(--t1)}
.ed mark{background:rgba(245,158,11,.35);color:var(--amb);box-shadow:0 0 8px rgba(245,158,11,.5)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html,body{overscroll-behavior-y:none;overflow:hidden}
body{font-size:16px;line-height:1.65}
#view{overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;padding-bottom:2.5rem}
input,select,textarea{padding:.85rem 1rem;font-size:1rem;min-height:3rem;line-height:1.5}
textarea{resize:none}
input[type=checkbox]{width:1.5rem;height:1.5rem;min-height:0;padding:0;flex:none;accent-color:var(--acc)}
.btn,.btn2{padding:.75rem 1.2rem;min-height:3rem}
.ib{min-width:2.75rem;height:2.75rem;font-size:1.2rem;border-radius:12px}
.pinoff{opacity:.3;filter:grayscale(1)}
.chips{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.25rem}
.chip{padding:.45rem 1rem;border-radius:999px;border:1px solid rgba(148,163,184,.3);color:var(--t1);white-space:nowrap;min-height:2.5rem}
.chip.on{background:var(--acc);color:#04120d;border-color:var(--acc);font-weight:700}
.swatch{width:2.4rem;height:2.4rem;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
.nbody{line-height:1.8rem;color:#E2E8F0;overflow-wrap:anywhere;background-image:repeating-linear-gradient(transparent,transparent calc(1.8rem - 1px),rgba(148,163,184,.14) calc(1.8rem - 1px),rgba(148,163,184,.14) 1.8rem)}
.clamp{max-height:7.2rem;overflow:hidden;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
.blur{user-select:none}
.ed{min-height:12rem;line-height:1.8rem;padding:1rem;overflow-wrap:anywhere}
.ed:empty::before{content:attr(data-ph);color:#64748b}
.spin{animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.bt{filter:blur(9px);transition:filter .2s}.bt:active{filter:blur(0)}
body{line-height:1.5}
input,select,textarea{padding:.8rem 1.15rem;line-height:1.45}
#q{padding:.65rem 1.15rem;min-height:2.9rem;border-radius:999px}
.hb{width:2.9rem;height:2.9rem;display:grid;place-items:center;border-radius:12px;border:1px solid rgba(148,163,184,.3);color:var(--t1);flex:none}
.hb.spin{animation:none}.hb.spin svg{animation:rot .8s linear infinite}
.meta{font-size:.75rem;color:#94A3B8;display:flex;flex-wrap:wrap;align-items:center;gap:.35rem .6rem;line-height:1.3}
.acts{display:inline-flex;flex:none;border:1px solid rgba(148,163,184,.2);border-radius:12px;background:rgba(9,13,22,.55);overflow:hidden}
.acts button,.acts a{width:2.3rem;height:2.3rem;display:grid;place-items:center;color:#94A3B8}
.acts>*+*{border-left:1px solid rgba(148,163,184,.14)}
.acts .dng{color:#F87171}.acts .on{color:var(--amb)}.acts .off{opacity:.55}
.xb{width:2.4rem;height:2.4rem;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(148,163,184,.3);color:var(--t1)}
.dngb{color:#F87171;border-color:rgba(248,113,113,.4)}
.sw{display:grid;grid-template-columns:1fr 1fr;position:relative;border-radius:999px;background:#0F172A;border:1px solid rgba(148,163,184,.25);padding:3px;min-height:3rem}
.sw::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--acc);transition:transform .2s,background .2s}
.sw.on::before{transform:translateX(100%);background:#EF4444}
.sw span{position:relative;z-index:1;text-align:center;font-weight:700;font-size:.78rem;line-height:2.4rem;color:#94A3B8}
.sw span:first-child{color:#04120d}.sw.on span:first-child{color:#94A3B8}.sw.on span:last-child{color:#fff}
.sw.hm::before{background:#334155}.sw.hm span:first-child{color:#E2E8F0}.sw.hm.on::before{background:var(--acc)}.sw.hm.on span:first-child{color:#94A3B8}.sw.hm.on span:last-child{color:#04120d}
.cover{width:3.6rem;height:3.6rem;border-radius:14px;overflow:hidden;flex:none;border:1.5px solid;background:#0F172A;display:grid;place-items:center;color:#475569;padding:2px}
.cover img{width:100%;height:100%;object-fit:cover;border-radius:11px}
.lbb{min-width:2.4rem;height:2.4rem;display:grid;place-items:center;border-radius:12px;border:1px solid rgba(148,163,184,.25);color:#E2E8F0;background:rgba(30,41,59,.6)}
.nbody{line-height:1.55rem;background-image:repeating-linear-gradient(transparent,transparent calc(1.55rem - 1px),rgba(148,163,184,.14) calc(1.55rem - 1px),rgba(148,163,184,.14) 1.55rem)}
.clamp{max-height:6.2rem}
.blur{filter:blur(8px)}
.lockhint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#E2E8F0;font-size:.85rem;letter-spacing:.05em}
.ed{line-height:1.55rem}
#app input:not([type=checkbox]):not([type=file]),#app select,#app textarea{padding:.85rem 1.2rem;line-height:1.5}
#app select{padding-right:2.5rem}
#app #q{padding:.65rem 1.15rem}
.secret{color:transparent!important;text-shadow:0 0 9px rgba(248,250,252,.95)}
.secret:focus{color:var(--t1)!important;text-shadow:none}
</style>
</head>
<body>
<!-- Gate -->
<div id="gate" class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-5" style="background:radial-gradient(circle at 50% 20%,#0f2a3a,#090D16 60%)">
  <img src="icons/icon-192.png" class="w-24 h-24 rounded-3xl" alt="StealthKeep">
  <p id="gmsg" class="text-sm text-slate-300">ใส่ PIN 6 หลัก</p>
  <div id="dots" class="flex gap-3"></div>
  <div id="pad" class="grid grid-cols-3 gap-4 w-64"></div>
  <div id="rs" class="hidden flex flex-wrap justify-center gap-2 px-4 text-xs"><button id="rsf1" class="chip">♻️ กู้คืนจากไฟล์สำรอง</button><button id="rsg" class="chip">☁️ กู้คืนจาก Google Sheets</button><button id="rsc" class="chip hidden">ยกเลิกการกู้คืน</button></div>
  <input type="file" id="rsf" accept=".json,application/json" class="hidden">
</div>

<!-- App -->
<div id="app" class="hidden h-full flex flex-col">
  <header class="flex items-center gap-2 px-4 py-3 glass rounded-none border-x-0 border-t-0">
    <img src="icons/favicon-48.png" class="w-8 h-8 rounded-lg" alt="">
    <b class="text-white hidden sm:block">StealthKeep</b>
    <input id="q" placeholder="ค้นหาด่วน…" autocomplete="off">
    <button id="rf" class="hb" aria-label="รีเฟรช"></button>
    <button id="lock" class="hb" aria-label="ล็อก"></button>
  </header>
  <main id="view" class="flex-1 overflow-y-auto p-4 space-y-4"></main>
  <nav class="nav flex glass rounded-none border-x-0 border-b-0" id="nav"></nav>
</div>
<div id="lb" class="hidden fixed inset-0 z-40 bg-black/95 flex flex-col"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 z-50 glass px-4 py-2 text-white text-sm hidden"></div>

<script>
const VER='1.7.0',$=s=>document.querySelector(s),enc=new TextEncoder(),dec=new TextDecoder();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64=b=>{const u=new Uint8Array(b);let t='';for(let i=0;i<u.length;i+=8192)t+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(t)},ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
async function key(pin,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(o){const iv=crypto.getRandomValues(new Uint8Array(12));return JSON.stringify({v:1,s:meta.salt,iv:b64(iv),d:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},K,enc.encode(JSON.stringify(o))))})}
async function unseal(t,k){const o=JSON.parse(t);return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.iv)},k,ub(o.d))))}
let meta=JSON.parse(localStorage.sk_meta||'null'),S,K,duress=false,tab='home',buf='',first=null,LB=null,idle,editing=null,deferred,RS=null,AT=null,ABUSY=0,ABC=0,ABD=20000,ABL='';
const IMG=new Map(),PEND=new Map(),MAXRAM=60,MAXDB=150; // IMG = blob URL ของรูปในหน่วยความจำ, PEND = รูปที่กำลังโหลด
const DEF=()=>({check:[],notes:[],alb:[],docs:[],arch:[],cats:{},acats:{},set:{auto:60,api:'',token:'',arch:30}});
const decoy=()=>({...DEF(),check:[{id:1,at:Date.now()-72e5,t:'ซื้อของเข้าบ้าน',lv:'N',d:0}],notes:[{id:1,t:'รายการซื้อ',h:'นม ไข่ ขนมปัง',pin:0,cat:'ทั่วไป'}],docs:[{id:1,t:'ใบเสร็จค่าน้ำ',u:'https://example.com'}]});
const save=async()=>{if(!duress&&K){localStorage.sk_data=await seal(S);autoQ()}};
const log=()=>{};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(t._);t._=setTimeout(()=>t.classList.add('hidden'),2200)};
const uid=()=>Date.now()+Math.floor(Math.random()*1e3);

/* ---------- Gate ---------- */
$('#pad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<i></i>':`<button class="key" data-k="${k}">${k}</button>`).join('');
function rsUi(){const r=$('#rs');if(!r)return;r.classList.toggle('hidden',!((!meta&&!first)||RS));$('#rsf1').classList.toggle('hidden',!!RS);$('#rsg').classList.toggle('hidden',!!RS);$('#rsc').classList.toggle('hidden',!RS)}
function gate(msg,err){rsUi();$('#gmsg').textContent=msg;$('#dots').innerHTML='<i class="dot"></i>'.repeat(6);if(err){$('#dots').classList.add('shake');setTimeout(()=>$('#dots').classList.remove('shake'),400)}}
const dots=()=>[...$('#dots').children].forEach((d,i)=>d.classList.toggle('f',i<buf.length));
function press(k){if(k==='⌫')buf=buf.slice(0,-1);else if(buf.length<6)buf+=k;dots();if(buf.length===6){const p=buf;buf='';setTimeout(()=>{dots();submit(p)},120)}}
$('#pad').onclick=e=>{const k=e.target.dataset.k;if(k!==undefined)press(k)};
addEventListener('keydown',e=>{if($('#gate').classList.contains('hidden')){if(LB)lbKey(e);return}if(/^\d$/.test(e.key))press(e.key);if(e.key==='Backspace')press('⌫')});
async function submit(p){
  if(RS){try{const r=RS,k=await key(p,ub(r.salt)),n=await unseal(r.data,k);meta=r.dh?{salt:r.salt,dh:r.dh}:{salt:r.salt};localStorage.sk_meta=JSON.stringify(meta);localStorage.sk_data=r.data;if(r.at)localStorage.sk_sync=r.at;K=k;S=n;duress=false;RS=null;if(r.api&&!S.set.api){S.set.api=r.api;S.set.token=r.tok||''}await save();toast('กู้คืนข้อมูลแล้ว');return enter()}catch(e){return gate('PIN ไม่ถูกต้อง',1)}}
  if(!meta){
    if(!first){first=p;return gate('ยืนยัน PIN อีกครั้ง')}
    if(first!==p){first=null;return gate('PIN ไม่ตรงกัน ตั้งใหม่อีกครั้ง',1)}
    meta={salt:b64(crypto.getRandomValues(new Uint8Array(16)))};K=await key(p,ub(meta.salt));S=DEF();log('สร้างห้องนิรภัย');
    localStorage.sk_meta=JSON.stringify(meta);await save();return enter()}
  if(meta.dh&&await sha(p+meta.salt)===meta.dh){duress=true;S=decoy();return enter()}
  try{K=await key(p,ub(meta.salt));S=await unseal(localStorage.sk_data,K);duress=false;enter()}catch(e){gate('PIN ไม่ถูกต้อง',1)}
}
/* ---------- Backup / Restore ---------- */
const pkey=async(pw,salt,it)=>crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
async function wrapBk(env,pw){const sl=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),it=300000;return{app:'StealthKeep',fmt:2,enc:'pw',at:env.at,it,s:b64(sl),iv:b64(iv),d:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},await pkey(pw,sl,it),enc.encode(JSON.stringify(env))))}}
const mkEnv=()=>({app:'StealthKeep',fmt:2,at:Date.now(),meta:{salt:meta.salt,dh:meta.dh},data:localStorage.sk_data});
/* รับไฟล์/ข้อความสำรองทุกรูปแบบ (v2, v1.x export, blob จากชีตรุ่นเก่า) → {data,salt,dh,at} หรือ null */
async function openBk(text,pw0){try{let e=JSON.parse(text);
  if(e.enc==='pw'){const dc=async w=>JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(e.iv)},await pkey(w,ub(e.s),e.it||300000),ub(e.d))));let r=null;if(pw0)try{r=await dc(pw0)}catch(x){}
   if(!r){const pw=prompt('รหัสผ่านของไฟล์สำรองนี้');if(pw==null)return null;try{r=await dc(pw)}catch(x){toast('รหัสผ่านไม่ถูกต้อง');return null}}e=r}
  const data=typeof e.data==='string'?e.data:(e.s&&e.iv&&e.d?JSON.stringify(e):null),v=data&&JSON.parse(data);
  if(!v||typeof v.s!=='string'||!v.iv||!v.d)throw 0;
  return{data,salt:v.s,dh:e.meta&&e.meta.dh||'',at:+e.at||0}}catch(x){toast('ไฟล์ไม่ถูกต้อง — ต้องเป็นไฟล์สำรองของ StealthKeep');return null}}
function startRestore(p){RS=p;if(S)lock();buf='';gate('ใส่ PIN ของข้อมูลสำรองนี้');dots()}
$('#rsf1').onclick=()=>$('#rsf').click();
$('#rsf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const p=await openBk(await f.text());if(p)startRestore(p)};
$('#rsc').onclick=()=>{RS=null;buf='';gate(meta?'ใส่ PIN 6 หลัก':'ตั้ง PIN 6 หลักสำหรับห้องนิรภัย');dots()};
$('#rsg').onclick=async()=>{const u=(prompt('Apps Script Web App URL ที่เคยสำรองไว้')||'').trim();if(!u)return;const t=(prompt('Token')||'').trim();try{const r=await(await fetch(`${u}?token=${encodeURIComponent(t)}`)).json();if(!r.ok)return toast('Token ไม่ถูกต้องหรือสคริปต์ปฏิเสธ');if(!r.blob)return toast('ยังไม่มีข้อมูลสำรองบนชีตนี้');const p=await openBk(r.blob);if(p){p.api=u;p.tok=t;startRestore(p)}}catch(e){toast('เชื่อมต่อสคริปต์ไม่ได้')}};

/* ---------- สำรองอัตโนมัติขึ้น Google Sheets (เข้ารหัสด้วยรหัสผ่านสำรองแยก) ---------- */
const abOn=()=>S&&!duress&&S.set.ab&&S.set.api&&S.set.bkpw;
const abSt=t=>{localStorage.sk_abs=t};
function autoQ(){if(!abOn())return;clearTimeout(AT);AT=setTimeout(autoPush,ABD)}
async function autoPush(){clearTimeout(AT);AT=null;if(!abOn()||localStorage.sk_data===ABL)return;
  if(ABUSY){AT=setTimeout(autoPush,3000);return}
  const{api,token,bkpw}=S.set;ABUSY=1; /* อ่านค่าก่อน await แรก เพราะอาจถูกเรียกตอนล็อก */
  try{const g=await(await fetch(`${api}?token=${encodeURIComponent(token)}`)).json();if(!g.ok){abSt('⚠️ Token ไม่ถูกต้อง — สำรองอัตโนมัติไม่ทำงาน');return}
    let ra=0;try{ra=+JSON.parse(g.blob).at||0}catch(x){}
    if(ra>(+localStorage.sk_sync||0)){abSt('⚠️ บนชีตมีข้อมูลใหม่กว่า (จากเครื่องอื่น) — หยุดสำรองอัตโนมัติ กด “ดึงลง” ก่อน');if(!ABC){ABC=1;toast('บนชีตมีข้อมูลใหม่กว่า — กด “ดึงลง” ก่อนจึงจะสำรองต่อ')}return}
    const env=mkEnv();env.at=Date.now();const r=await(await fetch(api,{method:'POST',body:JSON.stringify({token,blob:JSON.stringify(await wrapBk(env,bkpw))})})).json();
    if(r.ok){localStorage.sk_sync=env.at;localStorage.sk_ab=env.at;ABL=env.data;ABC=0;abSt('')}else abSt('⚠️ ส่งไม่สำเร็จ: '+(r.error||''))}
  catch(e){abSt('⚠️ เชื่อมต่อไม่ได้ — จะลองใหม่เมื่อมีการแก้ข้อมูลครั้งถัดไป')}finally{ABUSY=0}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&AT)autoPush()});

function enter(){first=null;S.arch||=[];S.cats||={};S.acats||={};S.set.arch??=30;if(!duress&&S.set.arch>0){const lim=Date.now()-S.set.arch*864e5,old=S.check.filter(c=>c.d&&c.dn&&c.dn<lim);if(old.length){S.arch.unshift(...old);S.check=S.check.filter(c=>!old.includes(c));save()}}$('#gate').classList.add('hidden');$('#app').classList.remove('hidden');const t=new URLSearchParams(location.search).get('tab');if(t&&TABS.some(x=>x[0]===t))tab=t;R();bump()}

   if(p.salt!==meta.salt){if(!confirm('ข้อมูลบนชีตเป็นห้องนิรภัยคนละชุดกับเครื่องนี้ (เช่น เปลี่ยน PIN หรือสร้างจากเครื่องอื่น)\nกู้คืนจะแทนที่ข้อมูลและ PIN ในเครื่องนี้ทั้งหมด ต้องใช้ PIN ของข้อมูลบนชีต\nทำต่อหรือไม่?'))return 1;p.api=S.set.api;p.tok=S.set.token;startRestore(p);return 1}
   if(p.at&&p.at<(+localStorage.sk_sync||0)&&!confirm('ข้อมูลบนชีตเก่ากว่าที่เครื่องนี้เคยซิงก์ ต้องการดึงลงทับหรือไม่?'))return 1;
   const n=await unseal(p.data,K);n.set={...n.set,api:S.set.api,token:S.set.token,ab:S.set.ab,bkpw:S.set.bkpw||n.set.bkpw};S=n;ABC=0;if(p.at)localStorage.sk_sync=p.at;toast('ดึงข้อมูลแล้ว')}catch(e){toast('ดึงไม่สำเร็จ')}},
  exp:async()=>{const pw=prompt('ตั้งรหัสผ่านป้องกันไฟล์สำรอง (อย่างน้อย 8 ตัวอักษร)\nแนะนำ: ไฟล์ที่ไม่มีรหัสผ่านจะถูกป้องกันด้วย PIN 6 หลักเท่านั้น หากไฟล์หลุดอาจถูกเดา PIN ได้\n\nเว้นว่าง = ไม่ใช้รหัสผ่านไฟล์');if(pw===null)return 1;if(pw&&pw.length<8)return toast('รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร')||1;
   S.set.bk=Date.now();await save();let env=mkEnv();env.at=S.set.bk;if(pw)env=await wrapBk(env,pw);
   const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(env)],{type:'application/json'}));a.download=`stealthkeep-backup-${new Date().toISOString().slice(0,10)}-v${VER}.json`;a.click();toast(pw?'สำรองไฟล์แล้ว (มีรหัสผ่าน)':'สำรองไฟล์แล้ว')},
  imp:()=>{$('#impf').click();return 1},
 bkpw:()=>{const a=prompt('ตั้งรหัสผ่านสำรอง (อย่างน้อย 8 ตัวอักษร)\nใช้เข้ารหัสข้อมูลที่ส่งขึ้นชีต และต้องใส่ตอนกู้คืนบนเครื่องใหม่\n⚠️ ลืมรหัสนี้ = กู้คืนจากชีตไม่ได้\n\nเว้นว่าง = ลบรหัสผ่าน (จะปิดสำรองอัตโนมัติด้วย)');if(a===null)return 1;
   if(!a){S.set.bkpw='';S.set.ab=0;clearTimeout(AT);AT=null;return toast('ลบรหัสผ่านสำรองและปิดสำรองอัตโนมัติแล้ว')||0}
   if(a.length<8)return toast('รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร')||1;if(prompt('พิมพ์รหัสผ่านสำรองอีกครั้งเพื่อยืนยัน')!==a)return toast('รหัสผ่านไม่ตรงกัน')||1;
   S.set.bkpw=a;toast('ตั้งรหัสผ่านสำรองแล้ว — จดไว้ในที่ปลอดภัย')},
 abt:()=>{if(S.set.ab){S.set.ab=0;clearTimeout(AT);AT=null;return toast('ปิดสำรองอัตโนมัติแล้ว')||0}
   A.apisave();if(!S.set.api)return toast('ตั้ง URL และ Token ของ Google Sheets ก่อน')||1;if(!S.set.bkpw)return toast('ตั้งรหัสผ่านสำรองก่อน')||1;
   S.set.ab=1;ABC=0;toast('เปิดสำรองอัตโนมัติแล้ว — จะส่งขึ้นชีตหลังแก้ข้อมูล')},
 hmt:()=>{$('#hm').classList.toggle('on');return 1},
 hedit:(i,e)=>{const k=e.dataset.k;tab=k;if(k==='check')ckEd=+i;else if(k==='notes')editing=+i;else if(k==='alb')aEd=+i;else dEd=+i},
 hoff:(i,e)=>{const o=by(e.dataset.k,i);if(o)delete o.hm;toast('เอาออกจากหน้าแรกแล้ว')},
 hlp:(i,e)=>{const t=e.dataset.c;HLP.has(t)?HLP.delete(t):HLP.add(t)},
 imgclr:async()=>{IMG.forEach(u=>URL.revokeObjectURL(u));IMG.clear();try{await dbx('readwrite',s=>{s.clear()})}catch(e){}toast('ล้างแคชรูปแล้ว');return 1},
 wipe:()=>{if(confirm('ล้างเซสชันและล็อกทันที?')){lock()}return 1},
 install:async()=>{if(deferred){deferred.prompt();deferred=null}else toast('ใช้เมนูเบราว์เซอร์ → “เพิ่มลงหน้าจอหลัก”');return 1}
};
$('#view').addEventListener('change',async e=>{if(e.target.id==='auto'){S.set.auto=+e.target.value;bump();await save()}
  if(e.target.id==='aarch'){S.set.arch=+e.target.value;await save()}
  if(e.target.id==='impf'){const f=e.target.files[0];e.target.value='';if(!f)return;const p=await openBk(await f.text());if(p&&confirm('กู้คืนจากไฟล์นี้จะแทนที่ข้อมูลและ PIN ในเครื่องนี้ทั้งหมด (ยกเลิกได้ที่หน้าใส่ PIN โดยข้อมูลเดิมจะยังอยู่)\nทำต่อหรือไม่?'))startRestore(p)}
  if(e.target.dataset.a==='ctog'){await run(e.target)}});
async function run(el){const a=el.dataset.a;if(!A[a])return;if(duress&&['pin','dpin','push','pull','exp','imp'].includes(a))return;const skip=await A[a](el.dataset.i,el);await save();if(skip!==1)R()}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();tab=g.dataset.go;editing=null;aEd=null;ckEd=null;dEd=null;$('#q').value='';R();return}
  const el=e.target.closest('[data-a]');if(el&&el.type!=='checkbox'&&S)run(el)});

document.addEventListener('mousedown',e=>{if(e.target.closest('.tb'))e.preventDefault()});
$('#view').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='cet'&&e.target.tagName==='INPUT'){e.preventDefault();run({dataset:{a:'csave'}})}});
$('#view').addEventListener('paste',e=>{if(e.target.id==='nh'){e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))}});

/* ---------- Lightbox ---------- */
/* แคชรูป: RAM (blob URL) + IndexedDB เข้ารหัส AES-GCM ด้วยคีย์ของห้องนิรภัย (อ่านได้เฉพาะตอนปลดล็อกด้วย PIN เดิม) */
const idb=()=>idb.p||(idb.p=new Promise((ok,no)=>{try{const r=indexedDB.open('sk_cache',1);r.onupgradeneeded=()=>{r.result.createObjectStore('c',{keyPath:'k'}).createIndex('t','t')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}}));
const dbx=async(m,f)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('c',m);let q;try{q=f(t.objectStore('c'))}catch(e){return no(e)}t.oncomplete=()=>ok(q&&q.result);t.onerror=t.onabort=()=>no(t.error)})};
const cget=async k=>{try{const w=K;if(!w||duress)return null;const row=await dbx('readonly',s=>s.get(k));if(!row)return null;return{y:row.y,b:await crypto.subtle.decrypt({name:'AES-GCM',iv:row.iv},w,row.d)}}catch(e){return null}};
const cput=async(k,buf,y)=>{try{const w=K;if(!w||duress)return;const iv=crypto.getRandomValues(new Uint8Array(12)),d=await crypto.subtle.encrypt({name:'AES-GCM',iv},w,buf);
  await dbx('readwrite',s=>{s.put({k,iv,d,y,t:Date.now()})});
  await dbx('readwrite',s=>{const c=s.count();c.onsuccess=()=>{let n=c.result-MAXDB;if(n>0)s.index('t').openCursor().onsuccess=e=>{const u=e.target.result;if(u&&n-->0){u.delete();u.continue()}}}})}catch(e){}};
const d2b=d=>{const i=d.indexOf(','),m=/^data:([^;,]+)/.exec(d.slice(0,i));if(!m||m[1].indexOf('image/')!==0)throw new Error('สคริปต์ส่งข้อมูลที่ไม่ใช่รูปกลับมา — ลอง Deploy Code.gs เวอร์ชันล่าสุดอีกครั้ง');const bin=atob(d.slice(i+1)),u=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)u[j]=bin.charCodeAt(j);return new Blob([u],{type:m[1]})};
const touch=(id,u)=>{IMG.delete(id);IMG.set(id,u);while(IMG.size>MAXRAM){const[k,v]=IMG.entries().next().value;IMG.delete(k);URL.revokeObjectURL(v)}};
function ingest(id,d){if(IMG.has(id)||PEND.has(id))return;try{const bl=d2b(d);bl.arrayBuffer().then(b=>cput('i:'+id,b,bl.type));touch(id,URL.createObjectURL(bl))}catch(e){}}
function getImg(L,f){const id=f.id;if(IMG.has(id)){const u=IMG.get(id);touch(id,u);return Promise.resolve(u)}if(PEND.has(id))return PEND.get(id);
  const p=(async()=>{let bl;const c=await cget('i:'+id);if(c)bl=new Blob([c.b],{type:c.y||'image/jpeg'});else{const r=await gas(L.a,`action=img&id=${id}`);bl=d2b(r.d);bl.arrayBuffer().then(b=>cput('i:'+id,b,bl.type))}
    if(!S)throw new Error('locked');const u=URL.createObjectURL(bl);touch(id,u);return u})();
  PEND.set(id,p);const done=()=>{if(PEND.get(id)===p)PEND.delete(id)};p.then(done,done);return p}
async function openAlbum(a){const L=LB={a,list:[],i:0,z:1,mask:false,errs:{},tried:{},err:'',busy:1},lk='l:'+a.f;lbDraw();
  let cl=null;try{const c=await cget(lk);if(c)cl=JSON.parse(dec.decode(c.b))}catch(e){}
  if(LB!==L)return;
  if(cl&&cl.length){L.list=cl;L.i=Math.max(0,cl.findIndex(f=>f.id===a.cvId));L.busy=0;lbDraw()} // มีรายชื่อในแคช → แสดงรูปทันที แล้วค่อยอัปเดตเบื้องหลัง
  else if(a.cvId)getImg(L,{id:a.cvId,name:''}).then(()=>{if(LB===L)lbDraw()},()=>{}); // ไม่มีแคช แต่รู้รูปปก → โหลดรูปขนานกับรายชื่อ
  try{const r=await gas(a,`action=folder&id=${a.f}&show=${a.cvId||''}${cl&&cl.length||a.cvId?'&noimg=1':''}`);if(LB!==L)return;
    const cur=L.list[L.i]&&L.list[L.i].id;
    if(!r.files.length){L.list=[];L.err='ไม่พบรูปภาพในโฟลเดอร์นี้'}
    else{L.list=r.files;L.i=Math.max(0,r.files.findIndex(f=>f.id===(cur||r.sid||a.cvId)));if(r.d&&r.sid)ingest(r.sid,r.d)}
    cput(lk,enc.encode(JSON.stringify(r.files)),'j')}
  catch(e){if(!L.list.length)L.err=e.message}
  L.busy=0;if(LB===L)lbDraw()}
function loadCur(L,f){getImg(L,f).then(()=>{if(LB===L&&L.list[L.i]===f)lbDraw()},e=>{L.errs[f.id]=e.message;if(LB===L&&L.list[L.i]===f)lbDraw()})}
function pre(L){const n=L.list.length;if(!n)return;let run=PEND.size;for(const d of[1,2,-1,3]){if(run>=2)break;const f=L.list[((L.i+d)%n+n)%n];if(!f||f===L.list[L.i]||IMG.has(f.id)||PEND.has(f.id)||L.tried[f.id])continue;L.tried[f.id]=1;run++;getImg(L,f).then(()=>{if(LB===L)pre(L)},()=>{})}} // โหลดล่วงหน้า ถัดไป 2 / ก่อนหน้า 1 / ถัดไปอีก 1 (พร้อมกันไม่เกิน 2)
function setCover(L){const f=L.list[L.i],src=f&&IMG.get(f.id);if(!src)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),z=200,s=Math.min(im.width,im.height);c.width=c.height=z;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,z,z);L.a.cv=c.toDataURL('image/jpeg',.7);L.a.cvId=f.id;save();if(LB===L)lbDraw();toast('ตั้งเป็นปกแล้ว')};im.src=src}
function lbDraw(){const L=LB;if(!L)return;const f=L.list[L.i],src=f?IMG.get(f.id):'',er=f&&L.errs[f.id];$('#lb').classList.remove('hidden');if(f&&src)touch(f.id,src);if(f&&!src&&!er&&!PEND.has(f.id))loadCur(L,f);
  $('#lb').innerHTML=`<div class="flex items-center gap-2 p-3 text-white"><span class="flex-1 min-w-0 text-sm truncate">${f?`${L.i+1}/${L.list.length} • ${esc(f.name)}`:esc(L.a.t)}</span>${f?`<button class="lbb" id="cv" aria-label="ตั้งเป็นปก">${L.a.cvId===f.id?IC.starF:IC.star}</button><button class="lbb" id="zo">−</button><span class="text-xs w-10 text-center">${Math.round(L.z*100)}%</span><button class="lbb" id="zi">+</button><button class="lbb" id="mk" aria-label="ซ่อนรูป">${L.mask?IC.eyeoff:IC.eye}</button>`:''}<button class="lbb" id="cl2" aria-label="ปิด">${IC.x}</button></div>
  <div class="flex-1 overflow-auto flex items-center justify-center relative">${src?`<img src="${src}" decoding="async" style="transform:scale(${L.z});transition:transform .2s;max-width:100%;max-height:100%;object-fit:contain;${L.mask?'filter:blur(30px)':''}" alt="">`:`<div class="text-slate-400 px-6 text-center space-y-3"><div>${esc(L.err||er||(L.busy&&!f?'กำลังโหลดรายการรูป…':'กำลังโหลดรูป…'))}</div>${er?'<button class="btn2" id="rt">ลองใหม่</button>':''}</div>`}${L.mask&&src?'<b class="absolute text-emerald-400 tracking-widest border border-emerald-400 px-3 py-1">DATA SECURED // REDACTED</b>':''}</div>
  <div class="flex justify-between p-3"><button class="lbb" id="pv" aria-label="ก่อนหน้า" style="transform:scaleX(-1)">${IC.chev}</button><button class="lbb" id="nx" aria-label="ถัดไป">${IC.chev}</button></div>`;
  const n=L.list.length,go=d=>{if(!n)return;L.i=(L.i+d+n)%n;L.z=1;L.err='';lbDraw()},zz=d=>{L.z=Math.min(3,Math.max(.5,L.z+d));lbDraw()};
  $('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);if(f){$('#zi').onclick=()=>zz(.25);$('#zo').onclick=()=>zz(-.25);$('#mk').onclick=()=>{L.mask=!L.mask;lbDraw()};$('#cv').onclick=()=>setCover(L)}
  if($('#rt'))$('#rt').onclick=()=>{delete L.errs[f.id];lbDraw()};
  $('#cl2').onclick=()=>{LB=null;$('#lb').classList.add('hidden');$('#lb').innerHTML=''};L.go=go;L.zz=zz;if(src)pre(L)}
function lbKey(e){const L=LB;if(e.key==='ArrowRight')L.go(1);if(e.key==='ArrowLeft')L.go(-1);if(e.key==='+')L.zz(.25);if(e.key==='-')L.zz(-.25);if(e.key==='Escape')$('#cl2').click()}
let tx=0,ty=0;$('#lb').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$('#lb').addEventListener('touchend',e=>{if(!LB||LB.z>1||!LB.list.length)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)LB.go(dx<0?1:-1)});

$('#rf').innerHTML=IC.refresh;$('#lock').innerHTML=IC.lock;

addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
if('serviceWorker'in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)location.reload()});addEventListener('load',()=>navigator.serviceWorker.register('sw.js'))}
