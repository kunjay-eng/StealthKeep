<head>

<style>
:root{--bg:#090D16;--card:#1E293B;--acc:#10B981;--cy:#06B6D4;--amb:#F59E0B;--vio:#8B5CF6;--t1:#F8FAFC;--t2:#94A3B8}
html,body{height:100%;background:var(--bg);color:var(--t2);font-family:Sarabun,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-top:env(safe-area-inset-top)}
.glass{background:rgba(30,41,59,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,.14);border-radius:16px}
.btn{background:var(--acc);color:#04120d;font-weight:700;border-radius:12px;padding:.55rem 1rem}
.btn2{border:1px solid rgba(148,163,184,.3);color:var(--t1);border-radius:12px;padding:.5rem .9rem}
input,select,textarea{background:#0F172A;border:1px solid rgba(148,163,184,.25);border-radius:12px;padding:.6rem .8rem;color:var(--t1);width:100%;outline:none}
input:focus,select:focus{border-color:var(--cy)}
.tag{font-size:.68rem;font-weight:700;padding:.1rem .45rem;border-radius:6px;border:1px solid}
.blur{filter:blur(7px);transition:filter .25s;cursor:pointer}
.scan{position:relative;overflow:hidden}.scan::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--cy);box-shadow:0 0 12px var(--cy);top:-4px;opacity:0}
.scan:hover::after,.scan:active::after{opacity:1;animation:sc 1.2s linear infinite}@keyframes sc{to{top:100%}}
.done{text-decoration:line-through;opacity:.5}
.nav a{flex:1;text-align:center;font-size:.7rem;padding:.5rem 0 calc(.5rem + env(safe-area-inset-bottom))}
.nav a.on{color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--cy)}.dot.f{background:var(--acc);border-color:var(--acc);box-shadow:0 0 10px var(--acc)}
.key{height:60px;border-radius:50%;font-size:1.5rem;color:var(--t1);background:rgba(30,41,59,.7);border:1px solid rgba(148,163,184,.15)}.key:active{background:var(--acc);color:#000}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ed{min-height:90px;background:#0F172A;border:1px solid rgba(148,163,184,.25);border-radius:12px;padding:.6rem;color:var(--t1)}
.ed mark{background:rgba(245,158,11,.35);color:var(--amb);box-shadow:0 0 8px rgba(245,158,11,.5)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html,body{overscroll-behavior-y:none;overflow:hidden}
body{font-size:16px;line-height:1.65}
#view{overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;padding-bottom:2.5rem}
input,select,textarea{padding:.85rem 1rem;font-size:1rem;min-height:3rem;line-height:1.5}
textarea{resize:none}
input[type=date]{color-scheme:dark;appearance:none;-webkit-appearance:none;text-align:left}
button.chip:disabled{opacity:.3}
input[type=checkbox]{width:1.5rem;height:1.5rem;min-height:0;padding:0;flex:none;accent-color:var(--acc)}
.btn,.btn2{padding:.75rem 1.2rem;min-height:3rem}
.ib{min-width:2.75rem;height:2.75rem;font-size:1.2rem;border-radius:12px}
.pinoff{opacity:.3;filter:grayscale(1)}
.chips{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.25rem}
.chip{padding:.45rem 1rem;border-radius:999px;border:1px solid rgba(148,163,184,.3);color:var(--t1);white-space:nowrap;min-height:2.5rem}
.chip.on{background:var(--acc);color:#04120d;border-color:var(--acc);font-weight:700}
.swatch{width:2.4rem;height:2.4rem;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
.nbody{line-height:1.8rem;color:#E2E8F0;overflow-wrap:anywhere;background-image:repeating-linear-gradient(transparent,transparent calc(1.8rem - 1px),rgba(148,163,184,.14) calc(1.8rem - 1px),rgba(148,163,184,.14) 1.8rem)}
.clamp{max-height:7.2rem;overflow:hidden;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
.blur{user-select:none}
.ed{min-height:12rem;line-height:1.8rem;padding:1rem;overflow-wrap:anywhere}
.ed:empty::before{content:attr(data-ph);color:#64748b}
.spin{animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.bt{filter:blur(9px);transition:filter .2s}.bt:active{filter:blur(0)}
body{line-height:1.5}
input,select,textarea{padding:.8rem 1.15rem;line-height:1.45}
#q{padding:.65rem 1.15rem;min-height:2.9rem;border-radius:999px}
.hb{width:2.9rem;height:2.9rem;display:grid;place-items:center;border-radius:12px;border:1px solid rgba(148,163,184,.3);color:var(--t1);flex:none}
.hb.spin{animation:none}.hb.spin svg{animation:rot .8s linear infinite}
.meta{font-size:.75rem;color:#94A3B8;display:flex;flex-wrap:wrap;align-items:center;gap:.35rem .6rem;line-height:1.3}
.acts{display:inline-flex;flex:none;border:1px solid rgba(148,163,184,.2);border-radius:12px;background:rgba(9,13,22,.55);overflow:hidden}
.acts button,.acts a{width:2.3rem;height:2.3rem;display:grid;place-items:center;color:#94A3B8}
.acts>*+*{border-left:1px solid rgba(148,163,184,.14)}
.acts .dng{color:#F87171}.acts .on{color:var(--amb)}.acts .off{opacity:.55}
.xb{width:2.4rem;height:2.4rem;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(148,163,184,.3);color:var(--t1)}
.dngb{color:#F87171;border-color:rgba(248,113,113,.4)}
.sw{display:grid;grid-template-columns:1fr 1fr;position:relative;border-radius:999px;background:#0F172A;border:1px solid rgba(148,163,184,.25);padding:3px;min-height:3rem}
.sw::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--acc);transition:transform .2s,background .2s}
.sw.on::before{transform:translateX(100%);background:#EF4444}
.sw span{position:relative;z-index:1;text-align:center;font-weight:700;font-size:.78rem;line-height:2.4rem;color:#94A3B8}
.sw span:first-child{color:#04120d}.sw.on span:first-child{color:#94A3B8}.sw.on span:last-child{color:#fff}
.sw.hm::before{background:#334155}.sw.hm span:first-child{color:#E2E8F0}.sw.hm.on::before{background:var(--acc)}.sw.hm.on span:first-child{color:#94A3B8}.sw.hm.on span:last-child{color:#04120d}
.cover{width:3.6rem;height:3.6rem;border-radius:14px;overflow:hidden;flex:none;border:1.5px solid;background:#0F172A;display:grid;place-items:center;color:#475569;padding:2px}
.cover img{width:100%;height:100%;object-fit:cover;border-radius:11px}
.lbb{min-width:2.4rem;height:2.4rem;display:grid;place-items:center;border-radius:12px;border:1px solid rgba(148,163,184,.25);color:#E2E8F0;background:rgba(30,41,59,.6)}
.nbody{line-height:1.55rem;background-image:repeating-linear-gradient(transparent,transparent calc(1.55rem - 1px),rgba(148,163,184,.14) calc(1.55rem - 1px),rgba(148,163,184,.14) 1.55rem)}
.clamp{max-height:6.2rem}
.blur{filter:blur(8px)}
.hnav{display:flex;gap:.6rem;overflow-x:auto;position:sticky;top:0;z-index:5;margin:0 -1rem;padding:.6rem 1rem;background:rgba(9,13,22,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.hnav::-webkit-scrollbar{display:none}
#up{position:fixed;right:1rem;bottom:calc(5rem + env(safe-area-inset-bottom));width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;background:rgba(30,41,59,.55);border:1px solid rgba(148,163,184,.25);color:#E2E8F0;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
#up.show{opacity:.4;pointer-events:auto}#up:active{opacity:.9}
#dock{padding-bottom:.55rem}
#dkm{display:flex;gap:.75rem;align-items:center}
#dkv{width:6.4rem;height:3.6rem;flex:none;border-radius:10px;overflow:hidden;background:#000}
#dkv iframe{width:100%;height:100%;border:0;display:block}
.dki{display:flex;align-items:center;gap:.5rem;flex:1;min-width:0}
#dkt{display:block;color:#fff;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dks{display:block;font-size:.72rem;color:#94A3B8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dkc{display:flex;justify-content:space-around;margin-top:.45rem}
.dkb{min-width:2.8rem;height:2.4rem;display:grid;place-items:center;border-radius:12px;border:1px solid rgba(148,163,184,.25);color:#E2E8F0;background:rgba(30,41,59,.6);font-size:1.05rem}
.dkb.on{color:var(--acc);border-color:var(--acc)}
#dkse{display:none;align-items:center;gap:.6rem;margin-top:.4rem;font-size:.72rem;color:#94A3B8}
#dksk{padding:0;min-height:0;height:1.4rem;flex:1;accent-color:var(--acc);background:transparent}
#dock.aud #dkse{display:flex}#dock.aud #dkv{display:none}
#dock.wide #dkm{flex-direction:column;align-items:stretch;gap:.45rem}
#dock.wide #dkv{width:100%}
.lockhint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#E2E8F0;font-size:.85rem;letter-spacing:.05em}
.ed{line-height:1.55rem}
#app input:not([type=checkbox]):not([type=file]),#app select,#app textarea{padding:.85rem 1.2rem;line-height:1.5}
#app select{padding-right:2.5rem}
#app #q{padding:.65rem 1.15rem}
.secret{color:transparent!important;text-shadow:0 0 9px rgba(248,250,252,.95)}
.secret:focus{color:var(--t1)!important;text-shadow:none}
.nth{margin-top:.75rem}
.lks{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.75rem}
.lk{display:inline-flex;align-items:center;gap:.4rem;max-width:100%;min-height:2.25rem;padding:.35rem .85rem;border-radius:999px;border:1px solid;font-size:.85rem;font-weight:600;background:rgba(9,13,22,.45)}
.lk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lkr{display:flex;gap:.5rem;align-items:flex-start}
.lkr .xb{flex:none;margin-top:.25rem}
.nth-g{display:grid;gap:3px;border-radius:14px;overflow:hidden;height:11.5rem;border:1px solid rgba(148,163,184,.18);box-shadow:0 0 16px rgba(16,185,129,.12)}
.nth-g.g1{grid-template-columns:1fr}.nth-g.g2{grid-template-columns:1fr 1fr}
.nth-g.g3{grid-template-columns:1.6fr 1fr;grid-template-rows:1fr 1fr}.nth-g.g3 .nt:first-child{grid-row:1/3}
.nt{position:relative;display:block;overflow:hidden;min-width:0;min-height:0;padding:0;border:0;border-radius:0;background:#0F172A}
.nt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.nt:active img{filter:brightness(.8)}
.nt.ld{background:linear-gradient(110deg,#0F172A 30%,#1E293B 50%,#0F172A 70%);background-size:200% 100%;animation:nsh 1.2s linear infinite}
@keyframes nsh{to{background-position:-200% 0}}
.nerr{position:absolute;inset:0;display:grid;place-items:center;color:var(--amb);font-size:1.4rem}
.nplus{position:absolute;inset:0;display:grid;place-items:center;background:rgba(4,18,13,.62);color:#6EE7B7;font-size:1.9rem;font-weight:700;text-shadow:0 0 12px rgba(16,185,129,.75)}
.nth-e{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-size:.8rem;color:var(--amb)}
.nth-e .chip{min-height:2rem;padding:.2rem .8rem;font-size:.8rem}
#dock{position:relative}
#dock.min #dkv{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
#dock.min #dks,#dock.min #dkse,#dock.min #dkc,#dock.min #dkld{display:none!important}
#dock.min{padding-top:.35rem;padding-bottom:.35rem}#dock.min .dkb{height:2.1rem;min-width:2.4rem}#dock.min #dkt{font-size:.85rem}
.dki>div{cursor:pointer}
.selbar{position:sticky;top:0;z-index:5;background:rgba(15,23,42,.94);border-color:rgba(248,113,113,.45)}
.ck{width:1.7rem;height:1.7rem;flex:none;border-radius:8px;border:2px solid #64748B;display:grid;place-items:center;color:#1a0505;font-weight:800;font-size:1rem}
.ck.on{background:#F87171;border-color:#F87171;box-shadow:0 0 10px rgba(248,113,113,.6)}
.krcap{display:flex;justify-content:space-between;gap:.5rem;font-size:.8rem;color:#94A3B8;letter-spacing:.02em}.krcap span:first-child{color:var(--t1);font-weight:700}
.krbank{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px;border-radius:18px;background:linear-gradient(180deg,#2a3548,#121926);border:2px solid #3b4a63;box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 10px 28px rgba(0,0,0,.45)}
@media (min-width:640px){.krbank{grid-template-columns:repeat(3,minmax(0,1fr))}}
.krdoor{--c:#10B981;position:relative;display:flex;flex-direction:column;width:100%;min-height:12.75rem;padding:.7rem;text-align:left;border-radius:8px;border:1px solid rgba(0,0,0,.5);background-color:var(--c);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px),linear-gradient(150deg,rgba(255,255,255,.3),rgba(255,255,255,0) 42%,rgba(0,0,0,.32));box-shadow:inset 0 0 0 3px rgba(0,0,0,.16),inset 0 2px 0 rgba(255,255,255,.35),0 3px 0 rgba(0,0,0,.5);overflow:hidden;transition:transform .1s}
.krdoor:active{transform:translateY(2px);box-shadow:inset 0 0 0 3px rgba(0,0,0,.16),0 1px 0 rgba(0,0,0,.5)}
.krdoor>*{display:block}
.krvent{width:58%;height:1.3rem;border-radius:4px;background:repeating-linear-gradient(180deg,rgba(0,0,0,.55) 0 3px,transparent 3px 7px)}
.krnum{position:absolute;top:.6rem;right:.6rem;padding:.05rem .4rem;border-radius:4px;background:rgba(0,0,0,.42);color:#fff;font-size:.65rem;font-weight:800;letter-spacing:.06em}
.krplate{margin-top:1rem;padding:.4rem .55rem;border-radius:4px;background:#F8FAFC;color:#0F172A;border:1px solid rgba(0,0,0,.4);box-shadow:inset 0 1px 3px rgba(0,0,0,.25);line-height:1.25}
.krplate b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;font-weight:700;line-height:1.5}
.krplate small{display:block;color:#475569;font-size:.72rem;margin-top:.15rem}
.krfoot{margin-top:auto;padding-top:.8rem}
.krhint{display:inline-block;padding:.1rem .5rem;border-radius:999px;background:rgba(0,0,0,.4);color:#fff;font-size:.66rem}
.krhandle{position:absolute;right:.7rem;bottom:2.5rem;width:.5rem;height:2.7rem;border-radius:6px;background:linear-gradient(90deg,#f1f5f9,#94A3B8);box-shadow:0 1px 3px rgba(0,0,0,.55)}
.krkey{position:absolute;right:.55rem;bottom:.55rem;width:1.3rem;height:1.3rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fde68a,#b45309);box-shadow:0 1px 3px rgba(0,0,0,.6)}
.krkey::after{content:"";position:absolute;left:50%;top:50%;width:.22rem;height:.5rem;margin:-.22rem 0 0 -.11rem;border-radius:2px;background:#1c1917}
.krnew{align-items:center;justify-content:center;gap:.3rem;background:transparent;border:2px dashed rgba(148,163,184,.45);box-shadow:none;color:#CBD5E1}
.krnew span{font-size:2rem;line-height:1}
.krin{display:flex;align-items:flex-start;gap:.55rem;border-radius:16px;border:2px solid var(--c);padding:.6rem .5rem .6rem .6rem;background:linear-gradient(180deg,#02020a,#07070f);box-shadow:inset 0 12px 28px rgba(0,0,0,.55)}
.krmain{flex:1;min-width:0}
.krmain>.krplate{margin:0 0 .7rem}
.krmain>.krplate em{font-style:normal;font-size:.65rem;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--c);padding:.05rem .4rem;border-radius:4px;margin-right:.4rem}
.krmain .glass{padding:.8rem}
.krmain .btn2{padding:.65rem .4rem;font-size:.85rem;line-height:1.25}
.krmain .glass.p-5{padding:1rem}
.krmain .acts button,.krmain .acts a{width:2.05rem;height:2.05rem}
.krexit{position:sticky;top:.5rem;flex:none;width:2.75rem;height:clamp(10.5rem,44vh,15rem);padding:0;border:0;background:transparent;cursor:pointer;filter:drop-shadow(0 3px 5px rgba(0,0,0,.75));transform-origin:right center;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.krexit:active{transform:scale(.95)}
.krexit .krslab{position:absolute;inset:0;display:block;background-color:var(--c);background-image:linear-gradient(165deg,rgba(255,255,255,.38),rgba(255,255,255,.04) 42%,rgba(0,0,0,.3));clip-path:polygon(0 5%,100% 0,100% 100%,0 95%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),inset 2px 0 0 rgba(255,255,255,.2),inset -2px 0 0 rgba(0,0,0,.25)}
.krexit .krslab i{position:absolute;left:20%;right:20%;top:13%;height:2.1rem;border-radius:2px;background:repeating-linear-gradient(180deg,rgba(0,0,0,.5) 0 .3rem,transparent .3rem .7rem)}
.krexit .krslab em{position:absolute;left:0;right:0;bottom:.7rem;text-align:center;font-style:normal;font-size:.68rem;font-weight:800;letter-spacing:.03em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.krexit.kran{animation:krswing .5s ease-out}
@keyframes krswing{from{transform:perspective(260px) rotateY(62deg);opacity:.3}}
.swatch.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.28)}
.nav{position:relative;z-index:6;align-items:flex-end}
.nav a.mid{position:relative}
.nav a.mid .mi{width:3.2rem;height:3.2rem;margin:-1.5rem auto .15rem;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;background:linear-gradient(145deg,#34D399,#059669);box-shadow:0 0 0 4px var(--bg),0 6px 16px rgba(16,185,129,.45)}
.nav a.mid.on{box-shadow:none;font-weight:700}.nav a.mid.on .mi{box-shadow:0 0 0 4px var(--bg),0 0 18px rgba(16,185,129,.8)}
.lbstage{padding:18px 14px;border-radius:16px;background:linear-gradient(90deg,#0b1020,#151d30 50%,#0b1020);border:1px solid rgba(148,163,184,.14)}
.lbpaper{position:relative;width:100%;background:#fff;touch-action:none;box-shadow:0 6px 22px rgba(0,0,0,.6);border-radius:3px;overflow:hidden}
.lbpaper canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#lbo{pointer-events:none}
.lbpaper.lbg::after{content:"";position:absolute;inset:3.5%;border:1px dashed rgba(14,165,233,.55);pointer-events:none}
.lbic{background:#fff;color:#000;border-radius:10px;aspect-ratio:1;display:grid;place-items:center;border:2px solid transparent}.lbic:active{border-color:var(--acc)}
.lbth{background:#fff;border-radius:8px;padding:4px;display:grid;place-items:center}.lbth img{max-width:100%;height:auto}
#app input[type=range].lr{padding:0;min-height:0;height:1.6rem;flex:1;border:0;background:transparent;accent-color:var(--acc)}
</style>

<body>
<!-- Gate -->
<div id="gate" class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-5" style="background:radial-gradient(circle at 50% 20%,#0f2a3a,#090D16 60%)">
  <img src="icons/icon-192.png" class="w-24 h-24 rounded-3xl" alt="StealthKeep">
  <p id="gmsg" class="text-sm text-slate-300">ใส่ PIN 6 หลัก</p>
  <div id="dots" class="flex gap-3"></div>
  <div id="pad" class="grid grid-cols-3 gap-4 w-64"></div>
  <div id="rs" class="hidden flex flex-wrap justify-center gap-2 px-4 text-xs"><button id="rsf1" class="chip">♻️ กู้คืนจากไฟล์สำรอง</button><button id="rsg" class="chip">☁️ กู้คืนจาก Google Sheets</button><button id="rsc" class="chip hidden">ยกเลิกการกู้คืน</button></div>
  <input type="file" id="rsf" accept=".json,application/json" class="hidden">
</div>

<!-- App -->
<div id="app" class="hidden h-full flex flex-col">
  <header class="flex items-center gap-2 px-4 py-3 glass rounded-none border-x-0 border-t-0">
    <img src="icons/favicon-48.png" class="w-8 h-8 rounded-lg" alt="">
    <b class="text-white hidden sm:block">StealthKeep</b>
    <input id="q" placeholder="ค้นหาด่วน…" autocomplete="off">
    <button id="rf" class="hb" aria-label="รีเฟรช"></button>
    <button id="lock" class="hb" aria-label="ล็อก"></button>
  </header>
  <main id="view" class="flex-1 overflow-y-auto p-4 space-y-4"></main>
  <div id="dock" class="hidden flex-none glass rounded-none border-x-0 border-b-0 px-3 pt-2">
