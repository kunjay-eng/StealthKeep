<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StealthKeep</title>
<meta name="theme-color" content="#090D16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StealthKeep">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#090D16;--card:#1E293B;--acc:#10B981;--cy:#06B6D4;--amb:#F59E0B;--vio:#8B5CF6;--t1:#F8FAFC;--t2:#94A3B8}
html,body{height:100%;background:var(--bg);color:var(--t2);font-family:Sarabun,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-top:env(safe-area-inset-top)}
.glass{background:rgba(30,41,59,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,.14);border-radius:16px}
.btn{background:var(--acc);color:#04120d;font-weight:700;border-radius:12px;padding:.55rem 1rem}
.btn2{border:1px solid rgba(148,163,184,.3);color:var(--t1);border-radius:12px;padding:.5rem .9rem}
input,select,textarea{background:#0F172A;border:1px solid rgba(148,163,184,.25);border-radius:12px;padding:.6rem .8rem;color:var(--t1);width:100%;outline:none}
input:focus,select:focus{border-color:var(--cy)}
.tag{font-size:.68rem;font-weight:700;padding:.1rem .45rem;border-radius:6px;border:1px solid}
.blur{filter:blur(7px);transition:filter .25s;cursor:pointer}
.scan{position:relative;overflow:hidden}.scan::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--cy);box-shadow:0 0 12px var(--cy);top:-4px;opacity:0}
.scan:hover::after,.scan:active::after{opacity:1;animation:sc 1.2s linear infinite}@keyframes sc{to{top:100%}}
.done{text-decoration:line-through;opacity:.5}
.nav a{flex:1;text-align:center;font-size:.7rem;padding:.5rem 0 calc(.5rem + env(safe-area-inset-bottom))}
.nav a.on{color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--cy)}.dot.f{background:var(--acc);border-color:var(--acc);box-shadow:0 0 10px var(--acc)}
.key{height:60px;border-radius:50%;font-size:1.5rem;color:var(--t1);background:rgba(30,41,59,.7);border:1px solid rgba(148,163,184,.15)}.key:active{background:var(--acc);color:#000}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ed{min-height:90px;background:#0F172A;border:1px solid rgba(148,163,184,.25);border-radius:12px;padding:.6rem;color:var(--t1)}
.ed mark{background:rgba(245,158,11,.35);color:var(--amb);box-shadow:0 0 8px rgba(245,158,11,.5)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html,body{overscroll-behavior-y:none;overflow:hidden}
body{font-size:16px;line-height:1.65}
#view{overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;padding-bottom:2.5rem}
input,select,textarea{padding:.85rem 1rem;font-size:1rem;min-height:3rem;line-height:1.5}
textarea{resize:none}
input[type=checkbox]{width:1.5rem;height:1.5rem;min-height:0;padding:0;flex:none;accent-color:var(--acc)}
.btn,.btn2{padding:.75rem 1.2rem;min-height:3rem}
.ib{min-width:2.75rem;height:2.75rem;font-size:1.2rem;border-radius:12px}
.pinoff{opacity:.3;filter:grayscale(1)}
.chips{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.25rem}
.chip{padding:.45rem 1rem;border-radius:999px;border:1px solid rgba(148,163,184,.3);color:var(--t1);white-space:nowrap;min-height:2.5rem}
.chip.on{background:var(--acc);color:#04120d;border-color:var(--acc);font-weight:700}
.swatch{width:2.4rem;height:2.4rem;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
.nbody{line-height:1.8rem;color:#E2E8F0;overflow-wrap:anywhere;background-image:repeating-linear-gradient(transparent,transparent calc(1.8rem - 1px),rgba(148,163,184,.14) calc(1.8rem - 1px),rgba(148,163,184,.14) 1.8rem)}
.clamp{max-height:7.2rem;overflow:hidden;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
.blur{user-select:none}
.ed{min-height:12rem;line-height:1.8rem;padding:1rem;overflow-wrap:anywhere}
.ed:empty::before{content:attr(data-ph);color:#64748b}
.spin{animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.bt{filter:blur(9px);transition:filter .2s}.bt:active{filter:blur(0)}
</style>
</head>
<body>
<!-- Gate -->
<div id="gate" class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-5" style="background:radial-gradient(circle at 50% 20%,#0f2a3a,#090D16 60%)">
  <img src="icons/icon-192.png" class="w-24 h-24 rounded-3xl" alt="StealthKeep">
  <p id="gmsg" class="text-sm text-slate-300">ใส่ PIN 6 หลัก</p>
  <div id="dots" class="flex gap-3"></div>
  <div id="pad" class="grid grid-cols-3 gap-4 w-64"></div>
</div>

<!-- App -->
<div id="app" class="hidden h-full flex flex-col">
  <header class="flex items-center gap-3 px-4 py-3 glass rounded-none border-x-0 border-t-0">
    <img src="icons/favicon-48.png" class="w-8 h-8 rounded-lg" alt="">
    <b class="text-white hidden sm:block">StealthKeep</b>
    <input id="q" placeholder="ค้นหาด่วน…" autocomplete="off">
    <button id="rf" class="btn2 shrink-0 !px-3" aria-label="รีเฟรช">🔄</button>
    <button id="lock" class="btn2 shrink-0 !px-3" aria-label="ล็อก">🔒</button>
  </header>
  <main id="view" class="flex-1 overflow-y-auto p-4 space-y-4"></main>
  <nav class="nav flex glass rounded-none border-x-0 border-b-0" id="nav"></nav>
</div>
<div id="lb" class="hidden fixed inset-0 z-40 bg-black/95 flex flex-col"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 z-50 glass px-4 py-2 text-white text-sm hidden"></div>

<script>
const VER='1.2.0',$=s=>document.querySelector(s),enc=new TextEncoder(),dec=new TextDecoder();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
async function key(pin,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(o){const iv=crypto.getRandomValues(new Uint8Array(12));return JSON.stringify({v:1,s:meta.salt,iv:b64(iv),d:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},K,enc.encode(JSON.stringify(o))))})}
async function unseal(t,k){const o=JSON.parse(t);return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.iv)},k,ub(o.d))))}
let meta=JSON.parse(localStorage.sk_meta||'null'),S,K,duress=false,tab='home',buf='',first=null,LB=null,idle,editing=null,deferred;
const DEF=()=>({check:[],notes:[],alb:[],docs:[],arch:[],cats:{},acats:{},set:{auto:60,api:'',token:'',arch:30}});
const decoy=()=>({...DEF(),check:[{id:1,at:Date.now()-72e5,t:'ซื้อของเข้าบ้าน',lv:'N',d:0}],notes:[{id:1,t:'รายการซื้อ',h:'นม ไข่ ขนมปัง',pin:0,cat:'ทั่วไป'}],docs:[{id:1,t:'ใบเสร็จค่าน้ำ',u:'https://example.com'}]});
const save=async()=>{if(!duress&&K)localStorage.sk_data=await seal(S)};
const log=()=>{};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(t._);t._=setTimeout(()=>t.classList.add('hidden'),2200)};
const uid=()=>Date.now()+Math.floor(Math.random()*1e3);

/* ---------- Gate ---------- */
$('#pad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<i></i>':`<button class="key" data-k="${k}">${k}</button>`).join('');
function gate(msg,err){$('#gmsg').textContent=msg;$('#dots').innerHTML='<i class="dot"></i>'.repeat(6);if(err){$('#dots').classList.add('shake');setTimeout(()=>$('#dots').classList.remove('shake'),400)}}
const dots=()=>[...$('#dots').children].forEach((d,i)=>d.classList.toggle('f',i<buf.length));
function press(k){if(k==='⌫')buf=buf.slice(0,-1);else if(buf.length<6)buf+=k;dots();if(buf.length===6){const p=buf;buf='';setTimeout(()=>{dots();submit(p)},120)}}
$('#pad').onclick=e=>{const k=e.target.dataset.k;if(k!==undefined)press(k)};
addEventListener('keydown',e=>{if($('#gate').classList.contains('hidden')){if(LB)lbKey(e);return}if(/^\d$/.test(e.key))press(e.key);if(e.key==='Backspace')press('⌫')});
async function submit(p){
  if(!meta){
    if(!first){first=p;return gate('ยืนยัน PIN อีกครั้ง')}
    if(first!==p){first=null;return gate('PIN ไม่ตรงกัน ตั้งใหม่อีกครั้ง',1)}
    meta={salt:b64(crypto.getRandomValues(new Uint8Array(16)))};K=await key(p,ub(meta.salt));S=DEF();log('สร้างห้องนิรภัย');
    localStorage.sk_meta=JSON.stringify(meta);await save();return enter()}
  if(meta.dh&&await sha(p+meta.salt)===meta.dh){duress=true;S=decoy();return enter()}
  try{K=await key(p,ub(meta.salt));S=await unseal(localStorage.sk_data,K);duress=false;enter()}catch(e){gate('PIN ไม่ถูกต้อง',1)}
}
function enter(){first=null;S.arch||=[];S.cats||={};S.acats||={};S.set.arch??=30;if(!duress&&S.set.arch>0){const lim=Date.now()-S.set.arch*864e5,old=S.check.filter(c=>c.d&&c.dn&&c.dn<lim);if(old.length){S.arch.unshift(...old);S.check=S.check.filter(c=>!old.includes(c));save()}}$('#gate').classList.add('hidden');$('#app').classList.remove('hidden');const t=new URLSearchParams(location.search).get('tab');if(t&&TABS.some(x=>x[0]===t))tab=t;R();bump()}
function lock(){S=K=null;RV.clear();EX.clear();ckF='todo';AV=null;ckEd=null;buf='';editing=null;LB=null;$('#lb').classList.add('hidden');$('#app').classList.add('hidden');$('#gate').classList.remove('hidden');$('#q').value='';gate('ใส่ PIN 6 หลัก');dots()}
function bump(){clearTimeout(idle);const a=S&&S.set.auto;if(a>0)idle=setTimeout(lock,a*1000)}
['click','touchstart','keydown'].forEach(ev=>addEventListener(ev,()=>S&&bump(),{passive:true}));
$('#lock').onclick=lock;
$('#rf').onclick=async()=>{const b=$('#rf');b.classList.add('spin');try{const r=await navigator.serviceWorker.getRegistration();r&&await r.update()}catch(e){}if(S){R();bump()}setTimeout(()=>{b.classList.remove('spin');toast('รีเฟรชแล้ว')},500)};
gate(meta?'ใส่ PIN 6 หลัก':'ตั้ง PIN 6 หลักสำหรับห้องนิรภัย');

/* ---------- Views ---------- */
const TABS=[['home','🏠','หน้าแรก'],['check','✅','เช็คลิสต์'],['notes','📝','โน้ตลับ'],['alb','🖼️','อัลบั้ม'],['docs','📄','เอกสาร'],['set','⚙️','ตั้งค่า']];
const PAL=['#10B981','#06B6D4','#F59E0B','#8B5CF6','#EC4899','#3B82F6'],catC=c=>PAL[S.cats[c]??0];
let ckF='todo',ckN=20,nCat='ทั้งหมด',ckEd=null,aCat='ทั้งหมด',AV=null;const RV=new Set(),EX=new Set();
const sec=(t,b)=>`<section class="glass p-5 space-y-4"><h2 class="text-white font-bold text-lg">${t}</h2>${b}</section>`;
const fld=(l,h,hint)=>`<div class="space-y-2"><div class="text-sm text-slate-300">${l}</div>${h}${hint?`<p class="text-xs text-slate-500">${hint}</p>`:''}</div>`;
const empty=t=>`<p class="text-sm text-slate-500 py-6 text-center">${t}</p>`;
const tg=(t,c)=>`<span class="tag" style="color:${c};border-color:${c}">${t}</span>`;
const ib=(a,i,e,x='')=>`<button class="ib ${x}" data-a="${a}" data-i="${i}">${e}</button>`;
const chip=(on,a,v,t)=>`<button class="chip ${on?'on':''}" data-a="${a}" data-c="${esc(v)}">${esc(t)}</button>`;
const fdt=t=>new Date(t).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});
const dur=ms=>{const m=Math.max(0,Math.floor(ms/6e4)),d=Math.floor(m/1440),h=Math.floor(m%1440/60);return d?`${d} วัน ${h} ชม.`:h?`${h} ชม. ${m%60} นาที`:m?`${m} นาที`:'ไม่ถึง 1 นาที'};
const txt=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent};
const docType=u=>/tiktok/i.test(u)?['TIKTOK','#8B5CF6']:/facebook|fb\.watch/i.test(u)?['FACEBOOK','#06B6D4']:/spreadsheets/.test(u)?['SHEET','#10B981']:/\.pdf|\/file\/d/.test(u)?['PDF','#F59E0B']:/document/.test(u)?['DOC','#06B6D4']:['LINK','#94A3B8'];
const ckItem=(c,arch)=>{const at=c.at||c.id,dn=c.dn||at;return `<div class="rounded-xl bg-slate-900/50 p-4 space-y-3"><div class="flex gap-3 items-start"><input type="checkbox" class="mt-1" ${c.d?'checked':''} ${arch?'disabled':''} data-a="ctog" data-i="${c.id}"><span class="flex-1 break-words whitespace-pre-wrap leading-relaxed ${c.d?'done':'text-white'}">${esc(c.t)}</span></div>
<div class="flex items-center gap-2 pl-9">${c.lv==='C'?tg('CRITICAL','#EF4444'):tg('NORMAL','#10B981')}<span class="flex-1"></span>${arch?ib('crest',c.id,'↩️'):c.d?ib('carc',c.id,'📦'):ib('cedit',c.id,'✏️')}${ib('cdel',c.id,'🗑️')}</div>
<p class="pl-9 text-xs text-slate-400 leading-relaxed">เพิ่มเมื่อ ${fdt(at)}${c.up?` • แก้ไข ${fdt(c.up)}`:''}<br>${c.d?`เสร็จเมื่อ ${fdt(dn)} • ใช้เวลา ${dur(dn-at)}`:`ค้างมา ${dur(Date.now()-at)}`}</p></div>`};
const TB=`<div class="tb space-y-3"><div class="flex flex-wrap gap-2">${[['sz2','เล็ก'],['sz3','ปกติ'],['sz5','ใหญ่'],['sz6','ใหญ่พิเศษ']].map(([c,l])=>`<button type="button" tabindex="-1" class="chip" data-a="fmt" data-c="${c}">${l}</button>`).join('')}</div>
<div class="flex flex-wrap gap-2"><button type="button" tabindex="-1" class="chip" data-a="fmt" data-c="bold"><b>หนา</b></button><button type="button" tabindex="-1" class="chip" data-a="fmt" data-c="light">บาง</button><button type="button" tabindex="-1" class="chip" data-a="fmt" data-c="italic"><i>เอียง</i></button><button type="button" tabindex="-1" class="chip" data-a="fmt" data-c="underline"><u>ขีดเส้นใต้</u></button><button type="button" tabindex="-1" class="chip" data-a="fmt" data-c="clear">⟲ ล้าง</button></div>
<div class="flex flex-wrap gap-3 items-center">${['rgba(250,204,21,.45)','rgba(74,222,128,.4)','rgba(56,189,248,.4)','rgba(244,114,182,.4)'].map(c=>`<button type="button" tabindex="-1" class="swatch" style="background:${c}" data-a="fmt" data-c="hl:${c}" aria-label="ไฮไลต์"></button>`).join('')}<button type="button" tabindex="-1" class="chip" data-a="fmt" data-c="nohl">ไม่ไฮไลต์</button></div></div>`;
const noteCard=n=>{const cat=n.cat||'ทั่วไป',c=catC(cat),rv=RV.has(n.id),ex=EX.has(n.id),long=txt(n.h).length>180||(n.h.match(/<br|<div|<p/g)||[]).length>4;
return `<div class="glass p-4 space-y-3" style="border-left:5px solid ${c};background:linear-gradient(135deg,${c}22,rgba(30,41,59,.55) 60%)"><div class="flex items-start gap-1"><div class="flex-1 min-w-0"><b class="text-white text-lg break-words">${esc(n.t)}</b><div class="flex flex-wrap items-center gap-2 mt-1">${tg(esc(cat),c)}<span class="text-xs text-slate-400">${fdt(n.up||n.at||n.id)}</span></div></div>${ib('npin',n.id,'📌',n.pin?'':'pinoff')}${ib('eye',n.id,rv?'👁️':'🙈')}</div>
<div class="nbody ${rv?'':'blur'} ${long&&!ex?'clamp':''}" data-a="show" data-i="${n.id}">${n.h}</div>
<div class="flex items-center gap-1">${long?`<button class="chip" data-a="nexp" data-i="${n.id}">${ex?'ย่อ ▴':'อ่านต่อ ▾'}</button>`:''}<span class="flex-1"></span>${ib('ncopy',n.id,'📋')}${ib('nedit',n.id,'✏️')}${ib('ndel',n.id,'🗑️')}</div></div>`};
const V={
home:()=>`<div class="glass p-5 flex items-center gap-4" style="box-shadow:0 0 24px rgba(16,185,129,.18)"><span class="text-4xl">🛡️</span><div><b class="text-white text-lg">${duress?'ระบบพร้อมใช้งาน':'AES-256 SECURE'}</b><p class="text-xs">ข้อมูลเข้ารหัสในเครื่อง • v${VER}</p></div></div>
<div class="grid grid-cols-2 gap-4">${[['check','✅','ค้างในเช็คลิสต์',S.check.filter(c=>!c.d).length],['notes','📝','โน้ตลับ',S.notes.length],['alb','🖼️','อัลบั้ม',S.alb.length],['docs','📄','เอกสาร & ลิงก์',S.docs.length]].map(([k,i,n,v])=>`<a href="#" data-go="${k}" class="glass p-4 block"><div class="text-3xl text-white font-bold">${v}</div><div class="text-sm mt-1">${i} ${n}</div></a>`).join('')}</div>`,
check:()=>{if(ckEd!==null){const c=by('check',ckEd);if(!c)ckEd=null;else return sec('แก้ไขภารกิจ',fld('ภารกิจ',`<textarea id="cet" rows="5">${esc(c.t)}</textarea>`)+fld('ระดับความสำคัญ',`<select id="cel"><option value="N" ${c.lv!=='C'?'selected':''}>NORMAL</option><option value="C" ${c.lv==='C'?'selected':''}>CRITICAL</option></select>`)+`<p class="text-xs text-slate-400 leading-relaxed">เพิ่มเมื่อ ${fdt(c.at||c.id)}<br>ค้างมา ${dur(Date.now()-(c.at||c.id))}</p><div class="flex gap-3"><button class="btn flex-1" data-a="csave">💾 บันทึก</button><button class="btn2" data-a="ccancel">ยกเลิก</button></div>`)}const T=S.check.filter(c=>!c.d),D=S.check.filter(c=>c.d),L=ckF==='todo'?T:ckF==='done'?D:S.arch,sh=L.slice(0,ckN);
 return sec('เช็คลิสต์ความปลอดภัย',fld('ภารกิจใหม่','<textarea id="ct" rows="2" placeholder="พิมพ์ภารกิจ…"></textarea>')+`<div class="flex gap-3"><select id="cl" class="flex-1"><option value="N">NORMAL</option><option value="C">CRITICAL</option></select><button class="btn" data-a="cadd">เพิ่ม</button></div>`)
 +`<div class="chips">${chip(ckF==='todo','cf','todo','ค้างอยู่ '+T.length)}${chip(ckF==='done','cf','done','เสร็จแล้ว '+D.length)}${chip(ckF==='arch','cf','arch','คลัง '+S.arch.length)}</div>`
 +(ckF==='done'&&D.length?`<button class="btn2 w-full" data-a="carcall">📦 เก็บที่เสร็จทั้งหมดเข้าคลัง</button>`:'')+(ckF==='arch'&&S.arch.length?`<button class="btn2 w-full" data-a="cclear">🗑️ ล้างคลังถาวร</button>`:'')
 +`<div class="space-y-3">${sh.map(c=>ckItem(c,ckF==='arch')).join('')||empty(ckF==='todo'?'ไม่มีภารกิจค้าง 🎉':ckF==='done'?'ยังไม่มีรายการที่เสร็จ':'คลังว่าง')}</div>`+(L.length>ckN?`<button class="btn2 w-full" data-a="more">แสดงเพิ่ม (เหลือ ${L.length-ckN})</button>`:'')},
notes:()=>{if(editing!==null){const n=S.notes.find(x=>x.id===editing)||{},cats=Object.keys(S.cats);
